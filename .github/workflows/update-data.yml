name: Actualizar datos de SoloQ

on:
  schedule:
    # Cada 30 minutos. Ajusta la frecuencia según lo necesites.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar API de Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Commitear data.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: actualizar datos de SoloQ"
          git push
